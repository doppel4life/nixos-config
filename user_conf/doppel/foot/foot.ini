font = JetBrainsMono Nerd Font:pixelsize=16:antialias=true
font-bold = JetBrainsMono Nerd Font:style=Bold:pixelsize=16:antialias=true
font-italic = JetBrainsMono Nerd Font:style=Italic:pixelsize=16:antialias=true
font-bold-italic = JetBrainsMono Nerd Font:style=Bold Italic:pixelsize=16:antialias=true

[cursor]
style=beam
blink=yes

[bell]
urgent=yes
notify=yes
visual=yes

[url]
launch=xdg-open ${url}

[colors-dark]
background=100002
foreground=fdeadb
alpha=0.8
